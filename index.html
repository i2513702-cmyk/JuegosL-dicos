<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LudoApp · Ludoteca de Preguntas</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/theme-plus.css">
  <style>
    /* Live-style animated background for index */
    body::before{
      content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
      background:linear-gradient(135deg,#46178f,#1b0b42 50%,#0f2a6b,#46178f);
      background-size:300% 300%;animation:lpbg 22s ease infinite;
    }
    @keyframes lpbg{50%{background-position:100% 100%}}
    /* Floating particles */
    .bg-particles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
    .bg-particles i{position:absolute;width:var(--s);height:var(--s);left:var(--x);top:var(--y);background:rgba(255,255,255,.06);border-radius:var(--rd);animation:fl 14s ease-in-out infinite alternate;animation-delay:var(--d)}
    @keyframes fl{to{transform:translate(40px,-60px) rotate(90deg)}}
    /* Make site-head blend with background */
    .site-head{background:linear-gradient(90deg,rgba(70,23,143,.95),rgba(19,104,206,.88)) !important;border-bottom:1px solid rgba(255,255,255,.14)}
    .brand{background:linear-gradient(90deg,#ffc800,#ff6b9d);-webkit-background-clip:text;background-clip:text;color:transparent !important;font-size:1.35rem !important}
    .live-link{background:linear-gradient(90deg,#e21b3c,#ff6b9d) !important;color:#fff;font-weight:900;padding:8px 16px;border-radius:10px;text-decoration:none;box-shadow:0 3px 0 #9e1230;animation:lppulse 2s infinite}
    @keyframes lppulse{50%{box-shadow:0 3px 0 #9e1230,0 0 0 8px rgba(226,27,60,.22)}}
  </style>
</head>

<body>
  <div class="bg-particles" id="bg-particles"></div>
  <header class="site-head">
    <div class="site-head-inner">
      <div class="brand">🎓 LudoApp <span class="brand-sub">· Ludoteca de Preguntas</span></div>
      <nav id="main-nav" class="nav-tabs"></nav>
      <div id="user-bar" class="nav-tabs"></div>
      <a class="live-link" href="live.html" title="Partida en vivo estilo Kahoot">🔴 En vivo</a>
      <button id="sound-btn" class="btn-ghost text-sm" title="Activar o silenciar sonidos">🔊</button>
    </div>
  </header>

  <main id="app" class="page"></main>

  <footer class="site-foot">
    Juego educativo · Matemáticas, Lengua, Ciencias, Historia y más · Baraja personalizada por el docente
  </footer>

  <div id="toast-root" class="toast-root"></div>
  <script src="js/core/data.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/questionEngine.js"></script>
  <script src="js/core/progressionEngine.js"></script>
  <script src="js/core/avatars.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/core/gamekit.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/games/ludo.js"></script>
  <script src="js/games/batalla.js"></script>
  <script src="js/games/carrera.js"></script>
  <script src="js/games/conquista.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/core/sync.js"></script>
  <script>
    // Initialize floating background particles (like live.html)
    (function(){
      const b=document.getElementById('bg-particles');
      if(!b) return;
      for(let i=0;i<9;i++){
        const e=document.createElement('i');
        e.style.cssText=`--s:${60+Math.random()*140}px;--x:${Math.random()*100}%;--y:${Math.random()*100}%;--rd:${Math.random()>.5?'50%':'16px'};--d:-${Math.random()*14}s`;
        b.appendChild(e);
      }
    })();
    
    document.getElementById('sound-btn').addEventListener('click', function () {
      var on = App.ui.toggleSound();
      this.textContent = on ? '🔊' : '🔇';
    });
    var boot = function () { App.boot(); };
    if (App.sync && App.sync.init) App.sync.init().then(boot);
    else boot();
  </script>
</body>
</html>
