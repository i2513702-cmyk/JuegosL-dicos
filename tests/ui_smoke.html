<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/css/styles.css">
  <title>Smoke UI sobre HTTP + sync</title>
</head>
<body>
  <header class="site-head">
    <div class="brand">LudoApp</div>
    <nav id="main-nav" class="nav-tabs"></nav>
    <div id="user-bar" class="nav-tabs"></div>
    <button id="sound-btn" class="btn-ghost text-sm">🔊</button>
  </header>
  <main id="app" class="page"></main>
  <div id="toast-root"></div>
  <script src="/js/core/data.js"></script>
  <script src="/js/core/storage.js"></script>
  <script src="/js/core/questionEngine.js"></script>
  <script src="/js/core/progressionEngine.js"></script>
  <script src="/js/ui/ui.js"></script>
  <script src="/js/games/ludo.js"></script>
  <script src="/js/games/batalla.js"></script>
  <script src="/js/games/carrera.js"></script>
  <script src="/js/games/conquista.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/core/sync.js"></script>
  <script>
  var R = [];
  function ok(c, m) { R.push((c ? 'OK   ' : 'FAIL ') + m); }
  function btnByText(txt) {
    var all = document.querySelectorAll('#app button');
    for (var i = 0; i < all.length; i++) {
      if (all[i].textContent.indexOf(txt) !== -1) return all[i];
    }
    return null;
  }
  function appText() { return (document.getElementById('app').innerText || ''); }

  window.App.sync.init()
    .then(function () {
      ok(window.App.sync.isEnabled(), 'sync habilitado (ui/http)');
      window.App.boot();

      function inicio() { window.App.roam.sectionInicio(document.getElementById('app')); }

      /* docente crea sala */
      window.App.auth.login('profe', '1234');
      inicio();
      ok(!!btnByText('Crear nueva partida'), 'docente ve boton crear');
      btnByText('Crear nueva partida').click();
      var codeEl = document.querySelector('.lobby-code');
      var code = codeEl ? codeEl.textContent.replace(/[^A-Z0-9]/g, '') : '';
      ok(code.length === 5, 'codigo visible: ' + code);

      /* alumna se une por código en el MISMO navegador */
      window.App.auth.logout();
      window.App.auth.login('maria', '1234');
      inicio();
      var input = document.querySelector('.join-code');
      ok(!!input, 'input de codigo');
      input.value = code;
      btnByText('Unirme a la sala').click();
      ok(window.App.storage.getLobbies()[0].jugadores.length === 1, 'alumna unida en storage');
      ok(appText().indexOf('Te has unido') !== -1, 'alumna ve "Te has unido"');

      /* docente (ya en la misma base local) ve el chip */
      window.App.auth.logout();
      window.App.auth.login('profe', '1234');
      inicio();
      ok(appText().indexOf('María Torres') !== -1, 'docente ve nombre de alumna unida');

      /* inicia -> sala quedo en juego -> reabre */
      btnByText('Iniciar partida').click();
      inicio();
      ok(appText().indexOf('En juego') !== -1 && !!btnByText('Reabrir sala'), 'sala En juego con boton Reabrir');
      btnByText('Reabrir sala').click();
      inicio();
      ok(window.App.storage.getLobbies()[0].estado === 'abierta', 'sala reabierta');

      /* tras el smoke, limpiar para no dejar basura al usuario */
      window.App.lobby.close(window.App.storage.getLobbies()[0].id);

      document.documentElement.setAttribute('data-result', R.join(' || '));
    })
    .catch(function (e) {
      R.push('EXC ' + (e && e.message));
      document.documentElement.setAttribute('data-result', R.join(' || '));
    });
  </script>
</body>
</html>
