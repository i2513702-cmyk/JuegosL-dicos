<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=index.html#/red">
<title>LudoApp · Redirigiendo...</title>
<style>body{font-family:system-ui;background:#150833;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}.box{text-align:center}</style>
</head>
<body>
<div class="box">
  <h2>Ludo en red</h2>
  <p>Redirigiendo a la app...</p>
  <p><a href="index.html#/red" style="color:#c4b8f0">Entrar ahora</a></p>
</div>
<script>
  (function(){
    var p = location.search || '';
    var h = location.hash || '';
    var url = 'index.html#/red';
    if (p) {
      try {
        var u = new URLSearchParams(p);
        var s = (u.get('sala')||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
        if (s) url = 'index.html#/red/' + s;
      } catch(e){}
    }
    if (h && h.indexOf('#/red')===0) url = 'index.html' + h;
    location.replace(url);
  })();
</script>
</body>
</html>
