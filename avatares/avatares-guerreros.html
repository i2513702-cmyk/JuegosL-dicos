<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Avatares guerreros pixelados</title>
<style>
  body { font-family: sans-serif; background:#1e1e26; color:#eee; margin:0; padding:24px; }
  h1 { font-size:18px; font-weight:600; }
  p.hint { color:#aaa; font-size:13px; max-width:640px; }
  canvas { image-rendering: pixelated; display:block; margin:0 auto; background:#2a2a33; border-radius:8px; }
  .demo { margin-top:32px; padding:16px; background:#2a2a33; border-radius:8px; max-width:400px; }
  .demo select, .demo button { font-size:14px; padding:6px 10px; margin:4px 4px 4px 0; border-radius:6px; border:1px solid #555; background:#3a3a45; color:#eee; cursor:pointer; }
  .demo button.active { background:#5a5aaa; }
  code { background:#000; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>

<h1>Galería de avatares guerreros (16x16, estilo pixel art)</h1>
<p class="hint">5 personajes x 4 estados (reposo, ataque, defensa, curación). Dibujados con <code>fillRect</code> en canvas, sin imágenes externas. Los sprites vienen de <code>motor-sprites.js</code>, compartido con los 4 modos de juego.</p>

<canvas id="gallery"></canvas>

<div class="demo">
  <div>
    <select id="charSelect"></select>
  </div>
  <div id="stateButtons"></div>
  <canvas id="preview" width="240" height="240"></canvas>
</div>

<script src="motor-sprites.js"></script>
<script>
/* ---------- SPRITES: motor compartido (sin copia local) ---------- */
const CHARACTERS = Motor.CHARACTERS;
const drawBody  = Motor.drawBody;
const drawWeapon = Motor.drawWeapon;

/* estados visuales de los avatares (ver documentacion-sistema-avatares.md) */
const STATES = ['idle', 'attack', 'defend', 'heal'];
const STATE_LABELS = { idle:'reposo', attack:'ataque', defend:'defensa', heal:'curación' };

// ---------- GALERÍA ----------
const gallery = document.getElementById('gallery');
const gctx = gallery.getContext('2d');
const cellW = 110, cellH = 150, ps1 = 5;
gallery.width = cellW * CHARACTERS.length;
gallery.height = cellH * STATES.length;
gctx.font = '11px sans-serif';
gctx.fillStyle = '#ccc';
gctx.textAlign = 'center';

STATES.forEach((state, row) => {
  CHARACTERS.forEach((c, col) => {
    const ox = col*cellW + 20, oy = row*cellH + 20;
    drawBody(gctx, ox, oy, ps1, c, state);
    gctx.fillStyle = '#ccc';
    gctx.fillText(c.name, col*cellW + cellW/2, row*cellH + 135);
    gctx.fillStyle = '#888';
    gctx.fillText(STATE_LABELS[state], col*cellW + cellW/2, row*cellH + 148);
  });
});

// ---------- DEMO INTERACTIVA ----------
const charSelect = document.getElementById('charSelect');
CHARACTERS.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c.id; opt.textContent = c.name;
  charSelect.appendChild(opt);
});

const stateButtonsDiv = document.getElementById('stateButtons');
let currentState = 'idle';
STATES.forEach(s => {
  const btn = document.createElement('button');
  btn.textContent = STATE_LABELS[s];
  btn.dataset.state = s;
  if (s === currentState) btn.classList.add('active');
  btn.onclick = () => {
    currentState = s;
    [...stateButtonsDiv.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderPreview();
  };
  stateButtonsDiv.appendChild(btn);
});

const preview = document.getElementById('preview');
const pctx = preview.getContext('2d');

function renderPreview() {
  pctx.clearRect(0,0,preview.width,preview.height);
  const c = CHARACTERS.find(ch => ch.id === charSelect.value);
  drawBody(pctx, 30, 40, 12, c, currentState);
}
charSelect.onchange = renderPreview;
renderPreview();
</script>

</body>
</html>
