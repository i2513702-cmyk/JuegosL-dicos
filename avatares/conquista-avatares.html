<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conquista de territorios pixel</title>
<style>
  :root { --bg:#1b1b22; --panel:#26262f; --text:#eee; --text-dim:#9a9aa5; --accent:#6a6ad0; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; }
  h1 { font-size:16px; font-weight:600; margin:0 0 4px; }
  p.hint { color:var(--text-dim); font-size:12px; margin:0 0 16px; max-width:600px; }
  .layout { display:flex; gap:16px; flex-wrap:wrap; max-width:760px; margin:0 auto; }
  .map-panel { background:var(--panel); border-radius:10px; padding:16px; flex:1 1 380px; text-align:center; }
  canvas#map { image-rendering:pixelated; background:#2f2f3a; border-radius:8px; max-width:100%; height:auto; }
  .side { background:var(--panel); border-radius:10px; padding:16px; flex:1 1 200px; font-size:13px; }
  .side h2 { font-size:12px; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-dim); margin:0 0 8px; }
  .faction-row { display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-radius:6px; background:#1f1f28; margin-bottom:6px; }
  .swatch { width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:6px; }
  .champion { text-align:center; font-size:15px; font-weight:600; color:#4caf6b; min-height:22px; margin-top:10px; }
  button { margin-top:10px; font-size:13px; padding:8px 14px; border-radius:8px; border:none; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:default; }
</style>
</head>
<body>

<h1>Conquista de territorios pixel</h1>
<p class="hint">Mapa de 8x8 celdas. Cada facción parte de una celda y, en cada turno, intenta capturar una celda vecina libre o enemiga. Gana quien controle más territorio.</p>

<div class="layout">
  <div class="map-panel">
    <canvas id="map" width="360" height="360"></canvas>
    <button id="restartBtn" disabled>Reiniciar conquista</button>
  </div>
  <div class="side">
    <h2>Facciones</h2>
    <div id="factions"></div>
    <div class="champion" id="champion"></div>
  </div>
</div>

<script>
const CHARACTERS = [
  { id:'espadachin', name:'Espadachín',       skin:'#e8b88a', armor:'#3a5a8a', head:'#9a9a9a', boots:'#2a2a2a', weapon:'sword',    weaponColor:'#c0c0c0' },
  { id:'barbaro',    name:'Bárbaro',          skin:'#d0a070', armor:'#6a5a3a', head:'#5a3a1a', boots:'#3a2a1a', weapon:'axe',       weaponColor:'#9a9a9a' },
  { id:'caballero',  name:'Caballero',        skin:'#f0c9a0', armor:'#3a5a8a', head:'#c0a020', boots:'#2a2a3a', weapon:'sword',     weaponColor:'#c0c0c0', shield:true, shieldColor:'#c0a020' },
  { id:'lancero',    name:'Lancero',          skin:'#e8b88a', armor:'#2f6f4a', head:'#2a2a2a', boots:'#1a1a1a', weapon:'spear',     weaponColor:'#8a6a3a' },
  { id:'sombrio',    name:'Guerrero sombrío', skin:'#d8b090', armor:'#2a2a3a', head:'#141414', boots:'#0e0e0e', weapon:'dualblade', weaponColor:'#8a2f2f' },
];

const SIZE = 8, CELL = 44;
const map = document.getElementById('map');
const mctx = map.getContext('2d');
const factionsEl = document.getElementById('factions');
const championEl = document.getElementById('champion');
const restartBtn = document.getElementById('restartBtn');

let grid = [];
let running = false;

const STARTS = [ [0,0], [0,SIZE-1], [SIZE-1,0], [SIZE-1,SIZE-1], [Math.floor(SIZE/2),Math.floor(SIZE/2)] ];

function neighbors(x,y) {
  return [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([nx,ny]) => nx>=0 && nx<SIZE && ny>=0 && ny<SIZE);
}

function render() {
  mctx.clearRect(0,0,map.width,map.height);
  for (let y=0;y<SIZE;y++) {
    for (let x=0;x<SIZE;x++) {
      const owner = grid[y][x];
      mctx.fillStyle = owner === -1 ? '#33333f' : CHARACTERS[owner].armor;
      mctx.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
    }
  }
}

function renderSide() {
  const counts = CHARACTERS.map((c,i) => grid.flat().filter(o => o===i).length);
  factionsEl.innerHTML = '';
  CHARACTERS.forEach((c,i) => {
    const row = document.createElement('div');
    row.className = 'faction-row';
    row.innerHTML = '<span><span class="swatch" style="background:' + c.armor + '"></span>' + c.name + '</span><span>' + counts[i] + '</span>';
    factionsEl.appendChild(row);
  });
  return counts;
}

function startConquest() {
  championEl.textContent = '';
  restartBtn.disabled = true;
  grid = Array.from({length:SIZE}, () => Array(SIZE).fill(-1));
  STARTS.forEach(([y,x], i) => { grid[y][x] = i; });
  render(); renderSide();
  running = true;
  setTimeout(() => tick(0), 600);
}

function tick(ticks) {
  if (!running) return;
  const order = [0,1,2,3,4].sort(() => Math.random()-0.5);
  order.forEach(faction => {
    const owned = [];
    for (let y=0;y<SIZE;y++) for (let x=0;x<SIZE;x++) if (grid[y][x]===faction) owned.push([x,y]);
    if (owned.length === 0) return;
    const [ox,oy] = owned[Math.floor(Math.random()*owned.length)];
    const targets = neighbors(ox,oy).filter(([nx,ny]) => grid[ny][nx] !== faction);
    if (targets.length === 0) return;
    const [tx,ty] = targets[Math.floor(Math.random()*targets.length)];
    const isEnemy = grid[ty][tx] !== -1;
    const prob = isEnemy ? 0.35 : 0.9;
    if (Math.random() < prob) grid[ty][tx] = faction;
  });

  render();
  const counts = renderSide();
  const freeCells = grid.flat().filter(o => o===-1).length;

  if (freeCells === 0 || ticks >= 45) {
    running = false;
    const maxCount = Math.max(...counts);
    const winnerIdx = counts.indexOf(maxCount);
    championEl.textContent = 'Mayor territorio: ' + CHARACTERS[winnerIdx].name + ' (' + maxCount + ' celdas)';
    restartBtn.disabled = false;
    return;
  }
  setTimeout(() => tick(ticks+1), 500);
}

restartBtn.onclick = startConquest;
startConquest();
</script>

</body>
</html>
