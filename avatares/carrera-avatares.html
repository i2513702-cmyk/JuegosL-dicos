<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrera de guerreros pixel</title>
<style>
  :root { --bg:#1b1b22; --panel:#26262f; --text:#eee; --text-dim:#9a9aa5; --accent:#6a6ad0; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; }
  h1 { font-size:16px; font-weight:600; margin:0 0 4px; }
  p.hint { color:var(--text-dim); font-size:12px; margin:0 0 16px; max-width:600px; }
  .panel { background:var(--panel); border-radius:10px; padding:16px; max-width:700px; margin:0 auto; }
  canvas#track { image-rendering:pixelated; background:#2f2f3a; border-radius:8px; width:100%; max-width:660px; display:block; margin:0 auto; }
  .ranking { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; font-size:12px; }
  .rank-item { background:#1f1f28; border-radius:6px; padding:6px 10px; color:var(--text-dim); }
  .rank-item.first { color:#4caf6b; font-weight:600; }
  .champion { text-align:center; font-size:15px; font-weight:600; color:#4caf6b; min-height:22px; margin-top:10px; }
  button { margin-top:8px; font-size:13px; padding:8px 14px; border-radius:8px; border:none; background:var(--accent); color:#fff; cursor:pointer; display:block; margin-left:auto; margin-right:auto; }
  button:disabled { opacity:0.5; cursor:default; }
</style>
</head>
<body>

<h1>Carrera pixel: 5 pilotos</h1>
<p class="hint">Cada carrito avanza con velocidad aleatoria en cada instante; el primero en cruzar la meta gana la carrera.</p>

<div class="panel">
  <canvas id="track" width="660" height="260"></canvas>
  <div class="ranking" id="ranking"></div>
  <div class="champion" id="champion"></div>
  <button id="restartBtn" disabled>Reiniciar carrera</button>
</div>

<script>
const CHARACTERS = [
  { id:'espadachin', name:'Espadachín',       skin:'#e8b88a', armor:'#3a5a8a', head:'#9a9a9a', boots:'#2a2a2a', weapon:'sword',    weaponColor:'#c0c0c0' },
  { id:'barbaro',    name:'Bárbaro',          skin:'#d0a070', armor:'#6a5a3a', head:'#5a3a1a', boots:'#3a2a1a', weapon:'axe',       weaponColor:'#9a9a9a' },
  { id:'caballero',  name:'Caballero',        skin:'#f0c9a0', armor:'#3a5a8a', head:'#c0a020', boots:'#2a2a3a', weapon:'sword',     weaponColor:'#c0c0c0', shield:true, shieldColor:'#c0a020' },
  { id:'lancero',    name:'Lancero',          skin:'#e8b88a', armor:'#2f6f4a', head:'#2a2a2a', boots:'#1a1a1a', weapon:'spear',     weaponColor:'#8a6a3a' },
  { id:'sombrio',    name:'Guerrero sombrío', skin:'#d8b090', armor:'#2a2a3a', head:'#141414', boots:'#0e0e0e', weapon:'dualblade', weaponColor:'#8a2f2f' },
];

function drawAvatarIcon(ctx, ox, oy, ps, c) {
  const px = (gx,gy,gw,gh,color) => { ctx.fillStyle=color; ctx.fillRect(ox+gx*ps, oy+gy*ps, gw*ps, gh*ps); };
  px(5,11,3,3,c.boots); px(8,11,3,3,c.boots);
  px(3,7,10,5,c.armor);
  px(4,1,8,2,c.head);
  px(4,3,8,3,c.skin);
  px(5,4,1,1,'#2a2a2a'); px(10,4,1,1,'#2a2a2a');
  px(1,7,2,4,c.skin); px(12,7,2,4,c.skin);
  ctx.fillStyle = c.weaponColor;
  ctx.fillRect(ox+13*ps, oy+6*ps, ps, ps*6);
}

const track = document.getElementById('track');
const tctx = track.getContext('2d');
const rankingEl = document.getElementById('ranking');
const championEl = document.getElementById('champion');
const restartBtn = document.getElementById('restartBtn');

const TRACK_LENGTH = 560;
const START_X = 40;
let racers = [];
let raceOver = false;

function laneY(i) { return 30 + i * 44; }

function render() {
  tctx.clearRect(0,0,track.width,track.height);
  // pista y meta
  for (let i=0;i<CHARACTERS.length;i++) {
    tctx.strokeStyle = '#3a3a45';
    tctx.beginPath(); tctx.moveTo(0, laneY(i)+34); tctx.lineTo(track.width, laneY(i)+34); tctx.stroke();
  }
  tctx.fillStyle = '#e0c060';
  tctx.fillRect(START_X + TRACK_LENGTH, 10, 4, track.height-20);

  racers.forEach((r, i) => {
    const x = START_X + r.x;
    const y = laneY(i);
    tctx.fillStyle = r.char.armor;
    tctx.fillRect(x, y+18, 26, 10);
    drawAvatarIcon(tctx, x-4, y-10, 1.6, r.char);
  });
}

function renderRanking() {
  const ranked = [...racers].sort((a,b) => b.x - a.x);
  rankingEl.innerHTML = '';
  ranked.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'rank-item' + (i===0 ? ' first' : '');
    div.textContent = (i+1) + '. ' + r.char.name;
    rankingEl.appendChild(div);
  });
}

function startRace() {
  championEl.textContent = '';
  restartBtn.disabled = true;
  raceOver = false;
  racers = CHARACTERS.map(c => ({ char:c, x:0 }));
  render(); renderRanking();
  setTimeout(tick, 500);
}

function tick() {
  if (raceOver) return;
  racers.forEach(r => { r.x += 5 + Math.random()*11; if (r.x > TRACK_LENGTH) r.x = TRACK_LENGTH; });
  render(); renderRanking();

  const winner = racers.find(r => r.x >= TRACK_LENGTH);
  if (winner) {
    raceOver = true;
    championEl.textContent = '¡' + winner.char.name + ' gana la carrera!';
    restartBtn.disabled = false;
    return;
  }
  setTimeout(tick, 450);
}

restartBtn.onclick = startRace;
startRace();
</script>

</body>
</html>
