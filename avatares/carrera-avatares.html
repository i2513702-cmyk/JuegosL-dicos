<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrera de guerreros pixel</title>
<style>
  :root { --bg:#1b1b22; --panel:#26262f; --text:#eee; --text-dim:#9a9aa5; --accent:#6a6ad0; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; }
  h1 { font-size:16px; font-weight:600; margin:0 0 4px; }
  p.hint { color:var(--text-dim); font-size:12px; margin:0 0 16px; max-width:600px; }
  .panel { background:var(--panel); border-radius:10px; padding:16px; max-width:700px; margin:0 auto; }
  /* escenario SVG 680:380 como fondo real de la pista, sin deformar */
  .stage { position:relative; width:100%; max-width:680px; margin:0 auto; aspect-ratio:680/380; background:#2f2f3a; border-radius:8px; overflow:hidden; }
  .stage .escenario { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; z-index:0; }
  canvas#track { position:relative; z-index:1; image-rendering:pixelated; background:transparent; display:block; width:100%; height:100%; }
  .ranking { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; font-size:12px; }
  .rank-item { background:#1f1f28; border-radius:6px; padding:6px 10px; color:var(--text-dim); }
  .rank-item.first { color:#4caf6b; font-weight:600; }
  .champion { text-align:center; font-size:15px; font-weight:600; color:#4caf6b; min-height:22px; margin-top:10px; }
  button { margin-top:8px; font-size:13px; padding:8px 14px; border-radius:8px; border:none; background:var(--accent); color:#fff; cursor:pointer; display:block; margin-left:auto; margin-right:auto; }
  button:disabled { opacity:0.5; cursor:default; }
</style>
</head>
<body>

<h1>Carrera pixel: 5 pilotos</h1>
<p class="hint">Cada carrito avanza con velocidad aleatoria en cada instante; el primero en cruzar la meta gana la carrera.</p>

<div class="panel">
  <div class="stage">
    <img class="escenario" src="../escenarios-estaticos/pista-de-carreras.svg" width="680" height="380" alt="Pista de carreras con cinco carriles y linea de meta a cuadros">
    <canvas id="track" width="680" height="380">Pista de carreras: los cinco pilotos avanzan hacia la meta.</canvas>
  </div>
  <div class="ranking" id="ranking" aria-live="polite"></div>
  <div class="champion" id="champion" role="status" aria-live="polite"></div>
  <button id="restartBtn" disabled>Reiniciar carrera</button>
</div>

<script src="motor-sprites.js"></script>
<script>
/* ---------- SPRITES: motor compartido (sin copia local) ---------- */
const CHARACTERS = Motor.CHARACTERS;
const drawIcon = Motor.drawIcon;

const track = document.getElementById('track');
const tctx = track.getContext('2d');
const rankingEl = document.getElementById('ranking');
const championEl = document.getElementById('champion');
const restartBtn = document.getElementById('restartBtn');

/* geometria del escenario pista-de-carreras.svg (viewBox 680x380):
   asfalto de y=190 a 380 con 5 carriles; la meta a cuadros arranca en x=600. */
const ROAD_TOP = 190, ROAD_BOTTOM = 380, LANES = 5;
const START_X = 14, FINISH_X = 600;
const TRACK_LENGTH = FINISH_X - START_X - 14;
let racers = [];
let raceOver = false;

function laneY(i) { return ROAD_TOP + i * ((ROAD_BOTTOM - ROAD_TOP) / LANES) + 2; }

function render() {
  tctx.clearRect(0,0,track.width,track.height);
  /* el asfalto, los carriles y la meta los dibuja el SVG de fondo:
     aqui solo los pilotos, que van por encima (z-index 1). */
  racers.forEach((r, i) => {
    const x = START_X + r.x;
    const y = laneY(i);
    tctx.fillStyle = r.char.armor;
    tctx.fillRect(x + 3, y + 24, 26, 8);
    drawIcon(tctx, x - 2, y - 2, 1.5, r.char);
  });
}

function renderRanking() {
  const ranked = [...racers].sort((a,b) => b.x - a.x);
  rankingEl.innerHTML = '';
  ranked.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'rank-item' + (i===0 ? ' first' : '');
    div.textContent = (i+1) + '. ' + r.char.name;
    rankingEl.appendChild(div);
  });
}

function startRace() {
  championEl.textContent = '';
  restartBtn.disabled = true;
  raceOver = false;
  racers = CHARACTERS.map(c => ({ char:c, x:0 }));
  render(); renderRanking();
  setTimeout(tick, 500);
}

function tick() {
  if (raceOver) return;
  racers.forEach(r => { r.x += 5 + Math.random()*11; if (r.x > TRACK_LENGTH) r.x = TRACK_LENGTH; });
  render(); renderRanking();

  const winner = racers.find(r => r.x >= TRACK_LENGTH);
  if (winner) {
    raceOver = true;
    championEl.textContent = '¡' + winner.char.name + ' gana la carrera!';
    restartBtn.disabled = false;
    return;
  }
  setTimeout(tick, 450);
}

restartBtn.onclick = startRace;
startRace();
</script>

</body>
</html>
