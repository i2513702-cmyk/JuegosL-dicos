<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LudoApp · Observar partidas en vivo</title>
<style>
:root{--bg1:#46178f;--bg2:#1b0b42;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--tx:#fff;--mut:#cbb8f5;--ok:#26d07c;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2) 60%,#0f2a6b);background-attachment:fixed}
.wrap{max-width:1500px;margin:0 auto;padding:18px clamp(12px,3vw,32px) 60px}
h1{margin:0 0 6px;font-size:1.6rem}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.center{max-width:560px;margin:8vh auto 0}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff;font-size:1rem;margin-top:8px}
button,.btn{cursor:pointer;border:0;border-radius:10px;padding:11px 18px;font-size:1rem;font-weight:700;color:#fff;background:linear-gradient(90deg,#7c3aed,#2563eb);text-decoration:none;display:inline-block}
button.ghost{background:rgba(255,255,255,.12);border:1px solid var(--line);font-weight:600}
button.sm{padding:5px 10px;font-size:.85rem}
.err{color:var(--bad);font-weight:700;min-height:22px;margin:8px 0 0}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px}
.code{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:900;letter-spacing:.18em;font-family:ui-monospace,Consolas,monospace;line-height:1}
.steps{margin:6px 0 0;padding-left:20px;color:var(--mut);font-size:.95rem}
.steps b{color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:16px;align-items:start}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tile.big{grid-column:1/-1}
.th{display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(0,0,0,.28)}
.th .nm{font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:#777;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.md{font-size:.85rem;color:var(--mut);white-space:nowrap}
.view{position:relative;width:100%;height:160px;overflow:hidden;background:rgba(0,0,0,.2)}
.view iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:transparent;pointer-events:none}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);text-align:center;padding:12px}
.cnt{font-weight:700}
.warn{background:rgba(255,200,0,.12);border:1px solid rgba(255,200,0,.4);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-top:12px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/core/data.js"></script>
<script src="js/core/storage.js"></script>
<script>
(function () {
  'use strict';
  var MODE = { ludo: '🎲 Ludo', batalla: '⚔️ Batalla', carrera: '🏁 Carrera', conquista: '🏰 Conquista' };
  var SKEY = 'ludoWatch';
  var root = document.getElementById('root');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var $ = function (q, r) { return (r || document).querySelector(q); };

  if (typeof io !== 'function') {
    root.innerHTML = '<div class="card center"><h1>Servidor en vivo no disponible</h1><p class="mut">Esta página necesita el servidor en vivo. Ábrela desde la URL donde desplegaste la app (o con <code>npm run live</code>), no como archivo suelto.</p></div>';
    return;
  }
  var socket = io();
  var sess = null;
  try { sess = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { sess = null; }
  var tiles = new Map();

  /* ---------- banco de preguntas de ESTE navegador ---------- */
  function bank() {
    var S = App.storage;
    return { courses: S.all('courses'), categories: S.all('categories'), difficulties: S.all('difficulties'), questions: S.all('questions') };
  }

  /* ---------- limpieza del HTML que envían los estudiantes (nunca se confía en él) ---------- */
  function sanitize(html) {
    var d = new DOMParser().parseFromString('<!DOCTYPE html><html><body>' + html + '</body></html>', 'text/html');
    d.body.querySelectorAll('script,iframe,frame,frameset,object,embed,applet,link,meta,base,form,audio,video,source,track,noscript').forEach(function (n) { n.remove(); });
    d.body.querySelectorAll('*').forEach(function (el) {
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        var n = a.name.toLowerCase(), v = a.value.replace(/[\s\u0000-\u001f]+/g, '').toLowerCase();
        if (n.indexOf('on') === 0 || n === 'href' || n === 'xlink:href' || n === 'action' || n === 'formaction' || n === 'srcdoc') el.removeAttribute(a.name);
        else if ((n === 'src' || n === 'srcset' || n === 'poster') && /^(javascript|vbscript|data:(?!image\/))/.test(v)) el.removeAttribute(a.name);
      });
    });
    return d.body.innerHTML;
  }

  function docFor(safeHtml, meta) {
    var o = location.origin;
    var csp = "default-src 'none'; img-src " + o + " data:; style-src " + o + " https://cdn.jsdelivr.net 'unsafe-inline'; font-src " + o + " data:";
    return '<!DOCTYPE html><html class="' + esc(meta.hcls || '') + '"><head><meta charset="utf-8">' +
      '<meta http-equiv="Content-Security-Policy" content="' + csp + '">' +
      '<base href="' + o + '/">' +
      '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">' +
      '<link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/theme-plus.css">' +
      '<style>html{background:linear-gradient(135deg,#46178f,#1b0b42 50%,#0f2a6b)}html,body{margin:0;overflow:hidden;pointer-events:none}</style></head>' +
      '<body class="' + esc(meta.cls || '') + '"><main id="app" class="' + esc(meta.rcls || 'page') + '">' + safeHtml + '</main></body></html>';
  }

  /* ---------- pantalla 1: crear sesión ---------- */
  function viewLogin(msg) {
    var qs = 0; try { qs = bank().questions.length; } catch (e) { /* sin datos */ }
    root.innerHTML =
      '<div class="card center"><h1>👁️ Observar partidas en vivo</h1>' +
      '<p class="mut">Crea una sesión: se genera un <b>código</b>. Los grupos lo escriben en su dispositivo y tú ves sus partidas en tiempo real.</p>' +
      '<label class="mut" style="display:block;margin-top:14px">Clave de docente (la que pusiste en <code>HOST_KEY</code>)</label>' +
      '<input id="key" type="password" autocomplete="current-password" placeholder="Clave de docente">' +
      '<p class="err" id="err">' + esc(msg || '') + '</p>' +
      '<button id="mk">Crear sesión de observación</button>' +
      '<div class="warn">📝 Se enviarán a los grupos las <b>' + qs + ' preguntas</b> de este navegador. Si quieres usar tus propias preguntas, créalas antes en el <a href="index.html#/docente" style="color:#ffe08a" target="_blank" rel="noopener">Panel docente</a> desde <b>este mismo navegador</b> y vuelve a cargar esta página.</div></div>';
    $('#key').focus();
    var go = function () {
      $('#err').textContent = '';
      socket.emit('watch:create', { key: $('#key').value, bank: bank() }, function (r) {
        if (!r || !r.ok) { $('#err').textContent = (r && r.error) || 'No se pudo crear la sesión'; return; }
        sess = { code: r.code, token: r.token, questions: r.questions };
        localStorage.setItem(SKEY, JSON.stringify(sess));
        viewSession();
      });
    };
    $('#mk').onclick = go;
    $('#key').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }

  /* ---------- pantalla 2: mosaico en vivo ---------- */
  function viewSession() {
    tiles.clear();
    root.innerHTML =
      '<div class="top"><div><h1>👁️ Partidas en vivo</h1>' +
      '<ol class="steps"><li>Los grupos abren <b>' + esc(location.origin) + '/index.html</b></li><li>Pulsan <b>📡 Docente</b> y escriben el código</li><li>Eligen <b>Jugar en grupo</b> y empiezan: su pantalla aparece aquí</li></ol></div>' +
      '<div style="text-align:center"><div class="mut" style="font-size:.85rem">CÓDIGO DE LA SESIÓN</div><div class="code" id="code">' + esc(sess.code) + '</div>' +
      '<div class="mut" style="margin-top:6px"><span id="cnt" class="cnt">0 grupos</span>' + (sess.questions ? ' · ' + sess.questions + ' preguntas enviadas' : '') + '</div></div>' +
      '<div><button class="ghost" id="end">Cerrar sesión</button></div></div>' +
      '<div class="grid" id="grid"></div><p class="mut" id="none" style="text-align:center;margin-top:40px">Esperando a que los grupos entren con el código…</p>';
    $('#end').onclick = function () {
      if (!confirm('¿Cerrar la sesión? Los grupos dejarán de transmitir.')) return;
      socket.emit('watch:close'); localStorage.removeItem(SKEY); sess = null; viewLogin();
    };
  }

  function counters() {
    var cnt = $('#cnt'), none = $('#none'); if (!cnt) return;
    var on = 0; tiles.forEach(function (t) { if (t.info.online) on++; });
    cnt.textContent = tiles.size + (tiles.size === 1 ? ' grupo' : ' grupos') + ' · ' + on + ' en línea';
    if (none) none.style.display = tiles.size ? 'none' : '';
  }

  function tile(id) {
    var t = tiles.get(id); if (t) return t;
    var el = document.createElement('div'); el.className = 'tile';
    el.innerHTML = '<div class="th"><span class="dot"></span><span class="nm"></span><span class="md"></span>' +
      '<button class="sm ghost" data-a="big" title="Ampliar">⤢</button><button class="sm ghost" data-a="kick" title="Sacar del grupo">✕</button></div>' +
      '<div class="view"><div class="empty">Esperando partida…</div></div>';
    t = { id: id, el: el, view: $('.view', el), info: { name: '', online: false, mode: '' }, cur: null, loading: false, queued: null, vw: 1000, vh: 700, rx: 0 };
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.a === 'big') { el.classList.toggle('big'); setTimeout(function () { rescale(t); }, 30); if (el.classList.contains('big')) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      if (b.dataset.a === 'kick' && confirm('¿Sacar a "' + t.info.name + '" de la sesión?')) { socket.emit('watch:kick', id); remove(id); }
    });
    tiles.set(id, t); $('#grid').appendChild(el);
    return t;
  }
  function remove(id) { var t = tiles.get(id); if (t) { t.el.remove(); tiles.delete(id); counters(); } }

  function info(t, i) {
    t.info = { name: i.name, online: !!i.online, mode: i.mode || '' };
    $('.nm', t.el).textContent = i.name;
    $('.dot', t.el).className = 'dot' + (i.online ? ' on' : '');
    $('.md', t.el).textContent = (MODE[i.mode] || '') + (t.rx && i.mode ? ' · ' + Math.max(0, Math.round((Date.now() - t.rx) / 1000)) + ' s' : '');
    var empty = $('.empty', t.view);
    if (!i.mode) {
      if (t.cur) { t.cur.remove(); t.cur = null; }
      if (!empty) { empty = document.createElement('div'); empty.className = 'empty'; t.view.appendChild(empty); }
      empty.textContent = i.online ? 'Sin partida activa' : 'Desconectado';
      t.view.style.height = '160px';
    }
    counters();
  }

  function rescale(t) {
    var W = t.view.clientWidth || 1, s = W / t.vw;
    if (t.cur) { t.cur.style.transform = 'scale(' + s + ')'; }
    t.view.style.height = Math.max(120, Math.round(t.vh * s)) + 'px';
  }

  function render(t, f) {
    if (t.loading) { t.queued = f; return; }
    var meta = f.meta || {};
    t.vw = meta.vw || 1000; t.vh = meta.vh || 700;
    var ifr = document.createElement('iframe');
    ifr.setAttribute('sandbox', '');                 // sin scripts, sin formularios, origen aislado
    ifr.setAttribute('referrerpolicy', 'no-referrer');
    ifr.style.width = t.vw + 'px'; ifr.style.height = t.vh + 'px'; ifr.style.visibility = 'hidden';
    ifr.style.transform = 'scale(' + ((t.view.clientWidth || 1) / t.vw) + ')';
    t.loading = true;
    var done = function () {
      if (!t.loading) return; t.loading = false; clearTimeout(guard);
      ifr.style.visibility = 'visible';
      var old = t.cur; t.cur = ifr; if (old) old.remove();
      var empty = $('.empty', t.view); if (empty) empty.remove();
      rescale(t);
      if (t.queued) { var q = t.queued; t.queued = null; render(t, q); }
    };
    var guard = setTimeout(done, 4000);
    ifr.addEventListener('load', done);
    ifr.srcdoc = docFor(sanitize(f.html || ''), meta);
    t.view.appendChild(ifr);
  }

  /* ---------- eventos del servidor ---------- */
  socket.on('watch:stream', function (i) { if (!sess || !$('#grid')) return; info(tile(i.id), i); });
  socket.on('watch:frame', function (f) {
    if (!sess || !$('#grid')) return;
    var t = tile(f.id); t.rx = Date.now();
    info(t, { name: t.info.name, online: true, mode: f.mode });
    render(t, f);
  });
  socket.on('connect', function () {
    if (!sess) return;
    socket.emit('watch:rejoin', { code: sess.code, token: sess.token }, function (r) {
      if (!r || !r.ok) { localStorage.removeItem(SKEY); sess = null; viewLogin('La sesión anterior ya no existe. Crea una nueva.'); return; }
      sess.questions = r.questions; viewSession();
      r.streams.forEach(function (s) { var t = tile(s.id); t.rx = s.html ? Date.now() : 0; info(t, s); if (s.html) render(t, s); });
    });
  });
  window.addEventListener('resize', function () { tiles.forEach(rescale); });
  setInterval(function () { tiles.forEach(function (t) { if (t.info.mode && t.rx) info(t, t.info); }); }, 1000);

  if (sess) root.innerHTML = '<div class="card center"><p class="mut">Reconectando con tu sesión…</p></div>';   // el evento "connect" retoma la sesión
  else viewLogin();
})();
</script>
</body>
</html>
